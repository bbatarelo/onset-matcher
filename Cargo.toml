[package]
name = "onset-matcher"
version = "0.1.0"
edition = "2024"

[dependencies]
# Audio file decoding (WAV, FLAC, MP3, OGG, etc.)
symphonia = { version = "0.5", features = ["all"] }

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Serialization (used in later features for JSON export)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
